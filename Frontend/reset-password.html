<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growia - Reset Your Magic Password</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); overflow: hidden; }

    .page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px; position: relative;
    }

    .reset-card {
      background: rgba(255,255,255,0.92); border-radius: var(--radius-xl);
      padding: 40px; width: 100%; max-width: 450px;
      box-shadow: var(--shadow-lg); text-align: center;
      position: relative; z-index: 10; animation: fadeIn 0.4s ease;
    }
    .card-title     { font-family: var(--font-display); font-size: 26px; color: var(--teal); margin-bottom: 8px; }
    .card-subtitle { font-size: 15px; color: var(--teal-light, #5a9dac); margin-bottom: 25px; font-weight: 600; }

    .form-group { text-align: left; margin-bottom: 18px; }
    .form-label { display: block; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; font-size: 14px; padding-left: 4px; }
    .form-input {
      width: 100%; padding: 14px 18px; box-sizing: border-box;
      border: 2px solid #e2e8f0; border-radius: var(--radius-full);
      font-size: 16px; transition: all 0.2s; outline: none;
    }
    .form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,147,117,0.1); }

    /* Strength meter */
    .strength-meter { height: 6px; background: #e2e8f0; margin-top: 8px; border-radius: var(--radius-full); overflow: hidden; }
    .strength-bar   { height: 100%; width: 0; transition: 0.3s; border-radius: var(--radius-full); }
    .strength-text  { display: block; margin-top: 5px; font-size: 11px; color: #64748b; }

    .btn-update {
      width: 100%; padding: 15px; background: var(--yellow); color: var(--text-dark);
      border: none; border-radius: var(--radius-full); font-weight: 800; font-size: 16px;
      cursor: pointer; transition: all 0.2s; margin-top: 10px;
    }
    .btn-update:hover:not(:disabled) { background: var(--yellow-dark); transform: scale(1.02); }
    .btn-update:disabled { opacity: 0.6; cursor: not-allowed; }

    #statusMsg { margin-top: 15px; font-size: 14px; font-weight: 600; }

    .back-to-login {
      display: inline-block; margin-top: 20px; color: var(--teal);
      text-decoration: none; font-size: 14px; font-weight: 700; transition: 0.3s;
    }
    .back-to-login:hover { color: var(--teal-light); }

    /* Ground */
    .ground { position: absolute; bottom: 0; width: 100%; height: 60px; z-index: 1; }
    .grass  { background: linear-gradient(to bottom,#7ec850,#5ca830); height: 40px; position: absolute; bottom: 0; width: 100%; }
    .fence  { height: 30px; background: repeating-linear-gradient(90deg,white 0,white 15px,transparent 15px,transparent 25px); border-top: 5px solid white; position: absolute; bottom: 30px; width: 100%; }
  </style>
</head>
<body>
<div class="page">
  <div class="cloud-shape" style="width:90px;height:34px;top:70px;left:60px;"><span style="display:block;position:absolute;width:44px;height:44px;background:white;border-radius:50%;top:-16px;left:12px;"></span></div>
  <div class="butterfly" style="top:200px;left:80px;"></div>
  <div class="sun-wrap"></div>

  <div class="reset-card">
    <h2 class="card-title">Growia Security</h2>
    <p class="card-subtitle">Enter your new password below</p>

    <form id="resetForm">
      <div class="form-group">
        <label class="form-label" for="newPass">New Magic Password</label>
        <input type="password" id="newPass" class="form-input" placeholder="Enter 6 or more characters" oninput="checkStrength()" autocomplete="new-password">
        <span class="error-msg" id="error-newPass"></span>
        
        <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>
        <small id="strengthText" class="strength-text"></small>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPass">Confirm Magic Password</label>
        <input type="password" id="confirmPass" class="form-input" placeholder="Confirm your password" autocomplete="new-password">
        <span class="error-msg" id="error-confirmPass"></span>
      </div>

      <button type="submit" class="btn-update" id="submitBtn">Update and Grow</button>
    </form>

    <div id="statusMsg"></div>
    <a href="#" id="backLink" class="back-to-login">← Back to Login</a>
  </div>

  <div class="ground">
    <div class="fence"></div>
    <div class="grass"></div>
  </div>
</div>

<script src="./script.js"></script>
<script>
  const params   = new URLSearchParams(window.location.search);
  const email    = params.get('email');
  const token    = params.get('token');
  const userType = (params.get('type') || 'parent').toLowerCase();

  // 🌟 التعديل الصحيح: استدعاء الملفات مباشرة لأنها في نفس الفولدر
  const backLink = document.getElementById('backLink');
  if (userType === 'child') {
    backLink.href        = './child_login.html'; 
    backLink.textContent = '← Back to Child Login';
  } else {
    backLink.href        = './parent-login.html'; 
    backLink.textContent = '← Back to Parent Login';
  }

  /* Password strength - Updated for 6 characters */
  function checkStrength() {
    const pass = document.getElementById('newPass').value;
    const bar  = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');

    if (!pass) {
      bar.style.width = '0'; text.textContent = '';
    } else if (pass.length < 6) {
      bar.style.cssText = 'width:30%;background:#ff4d4d'; 
      text.textContent = 'At least 6 characters required';
    } else {
      bar.style.cssText = 'width:100%;background:#2ecc71'; 
      text.textContent = 'Strong password!';
    }
  }

  /* Submit */
  document.getElementById('resetForm').onsubmit = async e => {
    e.preventDefault();
    if (typeof clearFormErrors === 'function') clearFormErrors();

    const newPassword     = document.getElementById('newPass').value;
    const confirmPassword = document.getElementById('confirmPass').value;
    const status          = document.getElementById('statusMsg');
    const btn             = document.getElementById('submitBtn');

    if (newPassword.length < 6) {
        if (typeof showFieldError === 'function') showFieldError('newPass', 'Minimum 6 characters required');
        return;
    }

    btn.textContent = 'Updating...';
    btn.disabled    = true;

    try {
        const response = await fetch(`${API_BASE_URL}/Auth/reset-password`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body:    JSON.stringify({ email, token, newPassword, confirmPassword })
        });

        const result = await response.json();

        if (response.ok) {
            status.style.color = '#2ecc71';
            status.textContent = result.message || 'Password updated successfully';
            btn.style.display = 'none'; 
            
            // 🌟 التوجيه التلقائي الصحيح مباشرة للملف المجاور بعد الـ 3 ثواني
            setTimeout(() => {
                window.location.href = userType === 'child' ? './child_login.html' : './parent-login.html';
            }, 3000);
        } else {
            btn.disabled = false;
            btn.textContent = 'Update and Grow';

            if (result.errors) {
                Object.keys(result.errors).forEach(key => {
                    let fieldId = key.charAt(0).toLowerCase() + key.slice(1);
                    if (fieldId === 'newPassword`) fieldId = 'newPass';
                    if (fieldId === 'confirmPassword') fieldId = 'confirmPass';

                    if (fieldId === 'email' || fieldId === 'token') {
                        status.style.color = '#ff4d4d';
                        status.textContent = 'Session expired or link invalid.';
                    } else {
                        if (typeof showFieldError === 'function') showFieldError(fieldId, result.errors[key][0]);
                    }
                });
            } else {
                status.style.color = '#ff4d4d';
                status.textContent = result.message || 'Something went wrong';
            }
        }

    } catch (err) {
        status.style.color = '#ff4d4d';
        status.textContent = 'Connection error. Is the API running?';
        btn.disabled = false;
        btn.textContent = 'Update and Grow';
    }
  };
</script>
</body>
</html>
