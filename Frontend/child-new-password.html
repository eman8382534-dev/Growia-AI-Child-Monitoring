<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growia - Reset Hero Password</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

    .reset-card {
      background: rgba(255,255,255,0.95); border-radius: var(--radius-xl);
      padding: 36px; width: 95%; max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center;
      animation: fadeIn 0.5s ease-out; position: relative; z-index: 10;
    }
    .card-icon { font-size: 50px; margin-bottom: 10px; display: block; }
    .card-title    { color: var(--teal); margin: 0 0 5px; font-size: 24px; font-family: var(--font-display); }
    .card-subtitle { color: var(--teal-light, #5a9dac); font-size: 14px; margin-bottom: 25px; font-weight: 600; }

    .form-group { text-align: left; margin-bottom: 15px; }
    .form-label { display: block; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; font-size: 13px; }

    .form-input {
      width: 100%; padding: 12px 18px; box-sizing: border-box;
      border: 2px solid #edf2f7; border-radius: var(--radius-full);
      font-size: 16px; transition: 0.3s; outline: none;
    }
    .form-input:focus  { border-color: var(--teal); background: white; }
    .form-input.valid  { border-color: #48bb78; background: #f0fff4; }
    .form-input.error  { border-color: var(--red-alert); background: #fff5f5; }

    .field-msg { font-size: 11px; font-weight: 700; margin: 4px 0 0 6px; display: block; min-height: 15px; }

    .btn-update {
      width: 100%; padding: 15px; background: var(--yellow); color: var(--text-dark);
      border: none; border-radius: var(--radius-full); font-weight: 800; font-size: 16px;
      cursor: pointer; transition: 0.2s; margin-top: 10px;
    }
    .btn-update:hover:not(:disabled) { background: var(--yellow-dark); transform: translateY(-2px); }
    .btn-update:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Ground */
    .ground { position: absolute; bottom: 0; width: 100%; z-index: 1; }
    .fence  { height: 30px; background: repeating-linear-gradient(90deg,white 0,white 15px,transparent 15px,transparent 25px); border-top: 5px solid white; }
    .grass  { background: linear-gradient(to bottom,#7ec850,#5ca830); height: 40px; }
  </style>
</head>
<body>

<div class="sun-wrap" style="position:absolute;top:20px;right:20px;z-index:5;">☀️</div>
<div class="cloud-shape" style="top:60px;left:50px;width:90px;height:35px;"><span style="display:block;position:absolute;width:45px;height:45px;background:white;border-radius:50%;top:-15px;left:15px;"></span></div>

<div class="reset-card">
  <span class="card-icon">🔐</span>
  <h2 class="card-title">Hero Password</h2>
  <p class="card-subtitle">Update your password</p>

  <div class="form-group">
    <label class="form-label" for="resetCode">Secret 4-Digit Code</label>
    <input type="text" id="resetCode" class="form-input" placeholder="Check with Parent" maxlength="4" autocomplete="one-time-code">
    <span id="msg-code" class="field-msg"></span>
  </div>

  <div class="form-group">
    <label class="form-label" for="newPass">New Magic Password</label>
    <input type="password" id="newPass" class="form-input" placeholder="Enter 6+ characters" autocomplete="new-password">
    <span id="msg-newPass" class="field-msg"></span>
  </div>

  <div class="form-group">
    <label class="form-label" for="confirmPass">Confirm Magic Password</label>
    <input type="password" id="confirmPass" class="form-input" placeholder="Repeat it here" autocomplete="new-password">
    <span id="msg-confirmPass" class="field-msg"></span>
  </div>

  <button class="btn-update" id="submitBtn" onclick="doReset()">Update &amp; Enter</button>
  <br>
  <a href="child_login.html" class="back-link" style="margin-top:15px;font-size:13px;">← Back to Login</a>
</div>

<div class="ground">
  <div class="fence"></div>
  <div class="grass"></div>
</div>

<script src="script.js"></script>
<script>
  
  const passRegex    = /^.{6,}$/; 

  const codeInp    = document.getElementById('resetCode');
  const passInp    = document.getElementById('newPass');
  const confirmInp = document.getElementById('confirmPass');

  function setStatus(inputEl, spanId, msg, isValid) {
    const span = document.getElementById(spanId);
    if (!span) return;
    span.textContent  = msg;
    span.style.color  = isValid ? '#48bb78' : '#e53e3e';
    inputEl.classList.toggle('valid',  isValid);
    inputEl.classList.toggle('error', !isValid);
  }

  codeInp.addEventListener('input', () => {
    codeInp.value = codeInp.value.replace(/[^0-9]/g, '');
    if (codeInp.value.length === 4) setStatus(codeInp, 'msg-code', 'Code entered', true);
    else setStatus(codeInp, 'msg-code', 'Enter 4 digits from your parent', false);
  });

  passInp.addEventListener('input', () => {
    if (passRegex.test(passInp.value)) setStatus(passInp, 'msg-newPass', 'Great password!', true);
    else setStatus(passInp, 'msg-newPass', 'Must be at least 6 characters', false);
    validateMatch();
  });

  confirmInp.addEventListener('input', validateMatch);

  function validateMatch() {
    if (confirmInp.value && confirmInp.value === passInp.value) setStatus(confirmInp, 'msg-confirmPass', 'Passwords match!', true);
    else if (!confirmInp.value) setStatus(confirmInp, 'msg-confirmPass', '', false);
    else setStatus(confirmInp, 'msg-confirmPass', 'Passwords do not match yet', false);
  }

  async function doReset() {
    const username = new URLSearchParams(window.location.search).get('username');

    if (!codeInp.value || !passInp.value || passInp.value !== confirmInp.value) {
      alert('Please check the fields!');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled    = true;
    btn.textContent = 'Saving...';

    try {
      const response = await fetch(`${API_BASE_URL}/Auth/reset-child-password-final`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          userName:    username,
          code:        codeInp.value,
          newPassword: passInp.value
        })
      });

      const result = await response.json();

      if (response.ok) {
        alert('Success! Your password is updated.');
        window.location.href = 'child_login.html';
      } else {
        if (result.errors) {
          Object.keys(result.errors).forEach(key => {
            let fieldId = key.charAt(0).toLowerCase() + key.slice(1);
            let msgId = 'msg-' + fieldId;
            
            if (fieldId === 'newPassword') { fieldId = 'newPass'; msgId = 'msg-newPass'; }
            if (fieldId === 'code') { fieldId = 'resetCode'; msgId = 'msg-code'; }

            const inputEl = document.getElementById(fieldId);
            if (inputEl) setStatus(inputEl, msgId, result.errors[key][0], false);
          });
        } else {
          setStatus(codeInp, 'msg-code', result.message || 'Invalid code', false);
        }
      }
    } catch {
      alert('Connection error!');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Update & Enter';
    }
  }
</script>
</body>
</html>
