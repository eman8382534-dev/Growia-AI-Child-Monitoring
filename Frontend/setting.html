<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growia - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .settings-card { background: #fff; padding: 25px; border-radius: 25px; border: 1px solid #eee; text-align: center; }
        .settings-input { width: 100%; padding: 10px; border-radius: 15px; border: 2px solid #eee; box-sizing: border-box; font-family: inherit; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #666; }
        .avatar-big { width: 80px; height: 80px; background: #FFB7B2; border-radius: 50%; color: white; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
    </style>
    <link rel="stylesheet" href="leafy.css">
</head>
<body>
    <section id="settings-page" style="padding: 20px 5%;">
        <div style="text-align:left; margin-bottom:20px;">
            <a href="leafy.html" class="btn" style="background:#FFD97D; border: none; padding: 10px 20px; border-radius: 20px; text-decoration: none; color: #333; font-weight: bold;">← Back to Hub</a>
        </div>
        <div style="display:flex; align-items:center; gap:15px; margin-bottom:10px;">
            <span style="font-size:2.5rem;">⚙️</span>
            <h1 style="color:#FF8A8A; margin:0;">Update Your Hero Profile</h1>
        </div>
        <p style="color:#4A6D6D; margin-bottom:30px;">Make your garden truly yours!</p>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 25px;">
            <div class="settings-card">
                <h4 style="color:#FF8A8A; margin: 0 0 20px 0;">Your Photo</h4>
                <div class="avatar-big">E</div>
                <button class="btn" style="background: #FF8A8A; color: white; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer;">Change Photo 📷</button>
            </div>
            <div class="settings-card" style="text-align:left;">
                <h4 style="color:#FF8A8A; margin: 0 0 20px 0; text-align: center;">Basic Info</h4>
                <div class="input-group"><label>Your Name</label><input type="text" class="settings-input" value="Explorer"></div>
                <div class="input-group"><label>Your Age</label><input type="number" class="settings-input" value="8"></div>
            </div>
        </div>

        <div style="background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 25px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
            <div style="background:#E8F5E9; padding:15px; border-radius:50%;"><img src="https://cdn-icons-png.flaticon.com/512/628/628283.png" width="50" alt="Buddy"></div>
            <div>
                <h4 style="color:#FF8A8A; margin: 0 0 5px 0;">Your Character Buddy</h4>
                <p style="font-size:0.8rem; color:#999; margin: 0 0 10px 0;">Give your garden buddy a special name!</p>
                <div class="input-group" style="margin:0; max-width:300px;"><input type="text" class="settings-input" value="Leafy"></div>
            </div>
        </div>

        <div style="text-align:center; margin-top:40px; margin-bottom: 40px;">
            <button class="btn" style="background:#FFD97D; padding:15px 60px; font-size:1.2rem; border: none; border-radius: 25px; font-weight: bold; cursor: pointer;" onclick="saveSettings()">Save Changes 💾</button>
        </div>
    </section>
    

<script src="script.js"></script>
<script>
// Load current profile
(async function() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
        const res = await fetch(`${API_BASE_URL}/Children/profile`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) return;
        const profile = await res.json();
        const nameInput = document.querySelector('input[value="Explorer"]');
        const ageInput  = document.querySelector('input[value="8"]');
        if (nameInput) nameInput.value = profile.fullName || '';
        if (ageInput)  ageInput.value  = profile.age || '';
    } catch(e) {}
})();

async function saveSettings() {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = 'child_login.html'; return; }

    const nameInput = document.querySelector('input[placeholder]');
    const ageInput  = document.querySelector('input[type="number"]');
    const fullName  = nameInput?.value?.trim();
    const age       = ageInput  ? parseInt(ageInput.value) : null;

    if (!fullName) { alert('Please enter your name!'); return; }

    try {
        const res = await fetch(`${API_BASE_URL}/Children/profile`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ fullName, age })
        });
        if (res.ok) {
            alert('Changes Saved! 💾');
        } else {
            alert('Could not save changes.');
        }
    } catch(e) {
        alert('Connection error!');
    }
}
</script>

</body>
</html>
